services:
  api:
    build: .
    ports:
      - "5000:5000"
    env_file: .env
    volumes:
      - flux-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  redis:
    image: redis:7-alpine
    profiles: [integrations]
    ports:
      - "6379:6379"
volumes:
  flux-data:
